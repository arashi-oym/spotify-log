name: Spotify再生記録

on:
  schedule:
    - cron: "17,47 * * * *"   # 1時間に2回（17分・47分ごろ）自動で実行。GitHubが混んで片方が飛ばされても、もう片方で拾う
  workflow_dispatch:        # 手動で実行するボタン（Run workflow）。外部の呼び出し（cron-job.org）もここから入る
    inputs:
      source:
        description: "呼び出し元（手動のときはそのままでOK）"
        required: false
        default: "manual"

permissions:
  contents: write   # data フォルダを保存するため
  pages: write      # 専用ページを公開するため
  id-token: write   # 専用ページを公開するため

concurrency:
  group: spotify-log
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      built: ${{ steps.build.outputs.ok }}   # ページを作れて、確認にも通ったか（yes のときだけ公開する）
    steps:
      - uses: actions/checkout@v5

      # 失敗しても次の手順（ページ作成・保存）は続け、結果をページに表示する
      - name: 再生履歴を取得
        id: fetch
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source || 'manual' }}
        run: python3 scripts/fetch.py

      # ページを作り、書き出したファイルを読み直して元のデータと同じか確かめる（違えば失敗にして、公開しない）
      - name: ページを作成
        id: build
        continue-on-error: true
        env:
          TRIGGER_TOKEN_EXPIRES: ${{ vars.TRIGGER_TOKEN_EXPIRES }}   # 外部呼び出し用の鍵の有効期限（GitHubの「Variables」に日付を入れておく）
        run: |
          python3 scripts/build_report.py
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      # 記録として保存するのは data フォルダだけ（専用ページは毎回作り直すので保存しない）
      # ページ作成が失敗しても、取得した再生の記録は必ず保存する
      - name: 保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git rm -r -q --cached --ignore-unmatch docs scripts/__pycache__   # 自動で作られるものは倉庫にしまわない
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "再生履歴を更新"
            git pull --rebase --autostash || true
            git push
          fi

      - name: 専用ページを準備
        if: steps.build.outputs.ok == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # 手当てが必要なエラーのときは、ここで失敗させて通知メールを送る
      - name: エラーのお知らせ
        if: steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error title=ページを作れませんでした::確認に通らなかったため、前のページをそのまま表示しています（記録は保存済み）。READMEの「止まったときの直し方」を確認してください。"
          fi
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then
            echo "::error title=Spotifyとの連携に問題があります::専用ページ上部の案内、またはREADMEの「止まったときの直し方」を確認してください。"
          fi
          exit 1

  deploy:
    needs: record
    # record がエラー通知で失敗扱いになっても、作れたページ（エラー表示つき）は公開する。作れなかったときは公開しない
    if: ${{ !cancelled() && needs.record.outputs.built == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 専用ページを公開
        id: deployment
        uses: actions/deploy-pages@v4
